name: Ruby

on:
  push:
    branches:
      - master
      - dev
      - boilerplate
      - idiomatic
      - rc1
      - rc2
      - rc3
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:

    strategy:
      fail-fast: false

      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

        ruby-version:
          # - head
          - '3.4'
          - '3.3'
          - '3.2'
          - '3.1'
          - '3.0'
          - '2.7'
          - '2.6'

        include:
          - os: ubuntu-latest
            ruby-version: '2.5'
          - os: ubuntu-latest
            ruby-version: '2.4'
          - os: ubuntu-latest
            ruby-version: '2.0'
          - os: windows-latest
            ruby-version: mingw

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checking out code
      uses: actions/checkout@v4

    - name: Remove Gemfile.lock
      run: rm -f Gemfile.lock

    - name: Set up Ruby v${{ matrix.ruby-version }}
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically

    - name: Show Ruby version
      run: ruby -v

    - name: Run tests
      run: bundle exec rake test

    - name: Gem build and install smoke
      shell: bash
      run: |
        gem build xqsr3-xml.gemspec
        gem install --local xqsr3-xml-*.gem
        ruby -e "require 'xqsr3/xml/version'; abort('VERSION missing') unless defined?(Xqsr3::XML::VERSION); puts Xqsr3::XML::VERSION"

  warnings:

    name: Warnings

    runs-on: ubuntu-latest

    steps:
    - name: Checking out code
      uses: actions/checkout@v4

    - name: Remove Gemfile.lock
      run: rm -f Gemfile.lock

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true

    - name: Show Ruby version
      run: ruby -v

    - name: Run unit tests with warnings
      run: ./run_all_unit_tests.sh --lib --warnings
